name: smartwear-judge
services:
  smartwear:
    image: smartwear-judge:1.0.0
    pull_policy: never
    init: true
    restart: unless-stopped
    environment:
      SMARTWEAR_ENVIRONMENT: development
      SMARTWEAR_JUDGE_MODE: "true"
      SMARTWEAR_AI_PYTHON: /usr/local/bin/python
      SMARTWEAR_CAPTURE_BACKEND_URL: http://127.0.0.1:8000
      SMARTWEAR_DATABASE_URL: sqlite:////app/backend/data/smartwear.db
    ports:
      - "127.0.0.1:${SMARTWEAR_PORT:-8000}:8000"
    volumes:
      - smartwear_data:/app/backend/data
      - smartwear_artifacts:/app/backend/static
    stop_grace_period: 30s

volumes:
  smartwear_data:
  smartwear_artifacts:
