[platformio]
core_dir = ../.platformio
default_envs = smartcap, smartwrist

[env]
platform = espressif32@6.9.0
framework = arduino
monitor_speed = 115200
build_flags = -I include

[env:smartcap]
board = esp32cam
upload_port = COM5
monitor_port = COM5
build_src_filter = +<smartcap.cpp>

[env:smartwrist]
board = esp32dev
upload_port = COM7
monitor_port = COM7
build_src_filter = +<smartwrist.cpp>
lib_deps = knolleary/PubSubClient@2.8
